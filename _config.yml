    - research.md
    - cv.md
    - media-resources.md

  hide_site_feed_link: true
  social_links:
    - title: Laura Puzzello's GitHub
      icon: github
      url: "https://github.com/L-Puzzello"
    - title: Laura Puzzello's Twitter
      icon: x-twitter
      url: "https://x.com/Lpuzzell"
    - title: Laura Puzzello's LinkedIn
      icon: linkedin
      url: "https://www.linkedin.com/in/puzzello-laura-b81732b"
