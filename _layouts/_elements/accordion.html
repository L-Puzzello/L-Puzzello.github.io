<style>
    ul.jekyll_accordion {
        position: relative;
        margin: 0 0;
        padding-bottom: 0;
    }

    ul.jekyll_accordion li {
        border-top: 1px solid rgba(0, 0, 0, 0.20);
        list-style: none;
        margin-left: 0;
        position: relative;
    }

    ul.jekyll_accordion li input {
        display: none;
    }

    ul.jekyll_accordion li label,
    ul.jekyll_accordion li span.accordion_static {
        display: flex;
        align-items: center;
        padding: 0.75rem 2.4rem 0.75rem 0;
        margin: 0;
        word-break: break-word;
    }

    ul.jekyll_accordion li label {
        cursor: pointer;
    }

    ul.jekyll_accordion li .date_of_publication {
        margin-right: 0.2rem;
        color: #888;
        font-size: 0.95em;
        min-width: 4em;
        flex-shrink: 0;
        word-break: break-word;
        white-space: normal;
    }

    ul.jekyll_accordion li div {
        display: none;
        padding: 0 2.5rem 1.2rem 2.5rem;
        text-align: justify;
    }

    ul.jekyll_accordion li input:checked + label + div {
        display: block;
    }

    ul.jekyll_accordion li label.has-content::before {
        content: "+";
        font-weight: normal;
        font-size: 130%;
        line-height: 1.1rem;
        padding: 0;
        position: absolute;
        right: 0.5rem;
        transition: all 0.15s ease-in-out;
    }

    ul.jekyll_accordion li input:checked + label.has-content::before {
        transform: rotate(-45deg);
    }
</style>

<ul class="jekyll_accordion">
    <li>
        {% if include.content %}
        <input id="{{ include.title }}" type="checkbox"/>
        <label class="has-content" for="{{ include.title }}">
            <span class="date_of_publication">{{ include.date_of_publication | markdownify }}</span>
            <span class="accordion_title">{{ include.title | markdownify }}</span>
        </label>
        <div>{{ include.content | markdownify }}</div>
        {% else %}
        <span class="accordion_static">
                <span class="date_of_publication">{{ include.date_of_publication | markdownify }}</span>
                <span class="accordion_title">{{ include.title | markdownify }}</span>
            </span>
        {% endif %}
    </li>
</ul>
